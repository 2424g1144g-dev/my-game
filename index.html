<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preload" href="assets/fonts/NaishoMoji-Regular.otf" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="assets/fonts/NekoSpoon.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="assets/fonts/PottaOne-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="assets/fonts/mouhitsu.ttf" as="font" type="font/ttf" crossorigin>
</head>
<body>
  <div id="first">Enterを押してスタート</div>

  <div id="flash"></div>
  <div id="titleContainer">
    <div id="title">無人島王<br><span id="subTitle">〜ツカゴエの無人島サバイバル育成RPG〜</span></div>
    <img id="titleBG" src="assets/BG/titleIsland.jpg">
    <img id="titleTsukagoe" src="assets/BG/titleTsukagoe.png">
    <div id="titleBGoverlay"></div>
    <div id="titleMenu">
      <span class="title-option" onclick="start()">▶ はじめる</span>
      <span class="title-option" onclick="tutorial()">▶ あそびかた</span>
      <span class="title-option" onclick="option()">▶ オプション</span>
    </div>
    <div id="titleCredit">㈱岡山県立西大寺高等学校2-4Co; || All Rights Reserved</div>
  </div>

  <div id="background_layer"></div>
  <div id="fadeWhite"></div>
  <div id="selectMenu">
    <span class="select-option">選択肢のサンプル</span>
    <span class="select-option">選択肢のサンプル２</span>
  </div>
  <div id="dialogue">
    <div id="dialogueBG">
      <span class="name">ナレーション</span>
      <span class="text">これはサンプルテキストだよ。<br>ツカゴエ先生あなたが犯人ですね。</span>
    </div>
    <div id="enterKey"></div>
  </div>
  <div id=dialogueSpeaking>
    <div id="box"></div>
    <div id="diaName"class="name">ニシモト　タツロウ</div>
    <div id="diaText" class="text">これはサンプルテキストだよ。<br>犯人はツカゴエかもしれないね。</div>
    <div id="diaState" class="state">SPEAKING</div>
    <div id="enterKey">
      <div id="mainEnter"></div>
      <div id="subEnter"></div>
    </div>
  </div>
  <div id="sprite">
    <img id="spriteContain">
  </div>



  <div id="startDebate">開幕！</div>
  <div id="circleDebate"></div>
  <div id="debate"><span>無</span><span>人</span><span>島</span><span>サ</span><span>バ</span><span>イ</span><span>バ</span><span>ル</span></div>

  <div id="trainingUI">
    <div id="trainingBottomCon">
      <div id="selectBG"></div>
      <div class="diamond-btn-container" style="left: 10vw;">
        <div class="diamond-shape"></div>
        <img src="assets/icons/sword.png" class="diamond-icon">
        <span class="diamond-text">修行</span>
      </div>
    </div>
  </div>




  <div style="display: none;" aria-hidden="true">
    <img src="assets/BG/titleTsukagoe.png" loading="eager">
    <img src="assets/BG/titleTsukagoeGood.png" loading="eager">
    <img src="assets/BG/shipTsukagoe.jpeg" loading="eager">
    <img src="assets/BG/ship.jpeg" loading="eager">
    <img src="assets/BG/sea.jpeg" loading="eager">
    <img src="assets/BG/titleIsland.jpg" loading="eager">
    <img src="assets/BG/layingTsukagoe.jpeg" loading="eager">
    <img src="assets/BG/landscape.jpeg" loading="eager">
    <img src="assets/BG/landscapeHouse.jpeg" loading="eager">
    <img src="assets/characters/mitsuhiro/Mitsuhiro_Normal.png" loading="eager">
    <img src="assets/characters/mitsuhiro/Mitsuhiro_Good.png" loading="eager">
    <img src="assets/characters/mitsuhiro/Mitsuhiro_Think.png" loading="eager">
    <img src="assets/characters/mitsuhiro/Mitsuhiro_Excited.png" loadiing="eager">
    <img src="assets/characters/mitsuhiro/Mitsuhiro_Surprised.png" loading="eager">
    <img src="assets/characters/mitsuhiro/Mitsuhiro_Despair.png" loading="eager">

  <script src="main.js"></script>
  <script src="assets/survive/growFunction.js"></script>
  <script src="assets/dialogues/diaFunction.js"></script>
  <script src="assets/dialogues/diaEvents.js"></script>
  <script src="assets/dialogues/diaLines.js"></script>
  
</body>
</html>
